<!DOCTYPE html>
<html lang="ru">
    <head>
        <title> Html tags for beginner 3</title>
        <meta http-equiv="Content-type" content="text/html;charset=UTF-8"/>
    </head>
    <body>
        <form action="#" method="post" enctype="multipart/form-data">
            <div>
            <p>Имя</p>
            
            <input tabindex="1" placeholder="Имя" type="text" name="username" value="">
         </div>

         <div>
            <p>Пароль</p>
            <input tabindex="2" placeholder="Пароль" type="password" name="userpass" value="">
         </div>

         <div>
            <p>Телефон</p>
            <input tabindex="3" placeholder="Номер телефона" type="tel" name="userphone">
         </div>

         <div>
            <p>Укажите пол</p>
            <div>
                <p><input tabindex="4" type="radio" name="female" value="woman"> Женский</p>
            </div>
            <div>
                <p><input tabindex="4" type="radio" name="male" value="woman"> Мужской</p>
            </div>
         </div>

         <div>
            <p>Имущество</p>
            <p><input tabindex="5" type="checkbox" name="velof" value="yes">Велосипед</p>
            <p><input tabindex="6" type="checkbox" name="car" value="yes">Машина</p>
            <p><input tabindex="7" type="checkbox" name="House" value="yes">Квартира</p>
         </div>

         <div>
            <p>Подробная информация</p>
            
            <textarea tabindex="8" name="text" ></textarea>
        
         </div>

         <div>
            <p>Прикрепите фото</p>
            <input tabindex="9" type="file" name="userphoto">
         </div>

         <div>
            <p>Любимый цвет</p>
            <select tabindex="10" name="color" >
                <option value="Red">Красный</option>
                <option value="Yellow">Желтый</option>
                <option value="Blue">Синий</option>
            </select>
         </div>

         <div>
            <p>Действия</p>
            <button tabindex="11" type="submit">Отправить</button>
            <button tabindex="12" type="reset">Очистить</button>
         </div>

        </form>

    </body>
</html>
