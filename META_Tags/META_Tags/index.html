<!doctype html>
<html lang="ru">
  <head>
    <title>CSS tags for beginner 2</title>

    <link rel="stylesheet" href="css/style.css" />

    <meta charset="UTF-8">
    <!-- На тот случай если адаптивность странице не треубется 
    <meta name="viewport" content="width=1170">-->
    <!-- Если адаптивность нужна-->
    <meta name="viewport" content="width=device-width,intial-scale=1.0,maximum-scale=1.0,user-scalable=0">
    <!-- Изначально на айос номера телефона выглядят как ссылка, этот мета тег выключает эту функцию-->
    <meta name="format-detection" content="telephone=no">
    <!-- Краткое описание страницы до 140 символов-->
    <meta name="description" content="Что такое мета теги">
    <!-- Ключевые слова-->
    <meta name="keywords" content="мета теги, meta tags">
    <!-- Управление поисковых роботов к странице, читай в txt-
    <meta name="robots">-->
     
    <!--Автор страницы -->
    <meta name="Author" content="Дарт Вейдер">
    <!--Авторские права -->
    <meta name="Copyright" content="Люк Скайуокер">
    <!--Адрес автора -->
    <meta name="Address" content="Татуин, кратер #37">


    <meta http-equiv="refresh" content="0; url=google.com">

    <!--- локализация сайта, для русскоязычного сайта ru_RU--->
    <meta property="og:locale" content="ru_RU">
    <!-- тип контента, по умолчанию используется article. -->
    <meta property="og:type" content="article">
    <!-- заголовок страницы, который будет выводится в записи социальной сети.
-->
    <meta property="og:title" content="МЕТА теги">
    <!-- описание страницы -->
    <meta property="og:description" content="Описание страницы про МЕТА теги">
    <!-- ссылка на изображение, которое будет публиковаться в записи -->
    <meta property="og:image" content="http://fls.guru/meta/img/bg.jpg">
    <!-- ссылка на текущую страницу -->
    <meta property="og:url" content="http://fls.guru/meta/">
    <!-- название сайта-->
    <meta property="og:site_name" content="Фрилансер по жизни">

    <!-- Тип карты, по умолчанию используется summary--->
    <meta name="twitter:card" content="summary">
    <!-- Имя/логин автора.-->
   <meta name="twitter:site" content="Жека">
    <!-- Название страницы -->
    <meta name="twitter:title" content="ΜΕΤΑ теги">
    <!-- Описание страницы -->
    <meta name="twitter:description" content="про МЕТА теги">
    <!-- Ссылка на изображение -->
I
    <meta name="twitter:image" content="http://fls.guru/meta/img">

  </head>
  <body>
    <h1>Всем привет я крутой</h1>
    <h2>Я сигма бой</h2>
    <p class="number">
      +77715107644
    </p>
   
  </body>
</html>
